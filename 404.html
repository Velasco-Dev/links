<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscando Enlace... | NOX Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #080114;
      --card: rgba(18, 7, 43, 0.92);
      --primary: #FF007F;
      --cyan: #00F0FF;
      --green: #00FF88;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 45%);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .box {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--card);
      border: 1px solid rgba(255, 0, 127, 0.3);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      max-width: 520px;
      width: 100%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.6rem;
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #C70062 100%);
      color: #FFF;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
    }
    .badge-slug {
      font-family: monospace;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="box" id="content-box">
    <div class="spinner" id="loading-spinner"></div>
    <h1 id="status-title">Resolviendo Enlace...</h1>
    <p id="status-desc">Buscando la direccion solicitada en el catalogo oficial de NOX.</p>
    <a href="./" class="btn btn-primary" id="btn-portal" style="display: none;">
      <i class="fa-solid fa-house"></i> Ir al Portal de Enlaces
    </a>
  </div>

  <script>
    (async function resolveRedirect() {
      // 1. Extraer segmentos de ruta relativos a la aplicacion y base URL
      const allSegments = window.location.pathname.split('/').filter(Boolean);
      const repoIdx = allSegments.indexOf('links');
      const basePath = repoIdx !== -1 ? '/' + allSegments.slice(0, repoIdx + 1).join('/') + '/' : '/';
      const relSegments = repoIdx !== -1 ? allSegments.slice(repoIdx + 1) : allSegments;
      const cleanSegments = relSegments.filter(s => s !== 'index.html' && s !== '404.html').map(s => s.toLowerCase());

      if (cleanSegments.length === 0) {
        window.location.replace(basePath);
        return;
      }

      if (cleanSegments[0] === 'admin') {
        window.location.replace(basePath + 'admin/');
        return;
      }

      // 2. Consultar archivo redirects.json dinamico con ruta absoluta
      try {
        const fetchUrl = basePath + 'redirects.json?v=' + Date.now();
        const res = await fetch(fetchUrl);
        if (res.ok) {
          const data = await res.json();
          const projects = data.projects || {};

          // Caso A: Ruta con proyecto y sub-enlace: /links/<project>/<slug>
          if (cleanSegments.length >= 2) {
            const pId = cleanSegments[0];
            const linkSlug = cleanSegments[1];
            if (projects[pId]) {
              const pLinks = projects[pId].links || [];
              const matchLink = pLinks.find(l => l.slug && l.slug.toLowerCase() === linkSlug && l.is_active !== false);
              if (matchLink && matchLink.url) {
                window.location.replace(matchLink.url);
                return;
              }
            }
          }

          // Caso B: Ruta de proyecto directo: /links/<project>/
          if (cleanSegments.length === 1 && projects[cleanSegments[0]]) {
            window.location.replace(basePath + cleanSegments[0] + '/');
            return;
          }

          // Caso C: Ruta plana o slug directo: /links/<slug>
          const singleSlug = cleanSegments[cleanSegments.length - 1];
          const match = (data.redirects || []).find(r => r.slug && r.slug.toLowerCase() === singleSlug && r.is_active !== false);
          if (match && match.url) {
            window.location.replace(match.url);
            return;
          }
        }
      } catch (e) {
        console.error('Error al resolver redirects.json:', e);
      }

      // 3. Fallback instantaneo de emergencia si falla la red
      const FALLBACK_REDIRECTS = {
        'menu': 'https://script.google.com/macros/s/AKfycbwa5lWCVfdBqZiOtkZGWWTk9OI2wPe84NrlPlrufVk1LDNItsAV-qHym2zkEwd9ucKdmg/exec',
        'db': 'https://docs.google.com/spreadsheets/d/1vqtsoonbIRhnQ8bas060h27p7C-TKAIDX7cdHE8Ok5E/edit',
        'editor': 'https://script.google.com/home/projects/19Jj1QYs18vnHqS9FqM41cnGebJPlyRewE035hxI8VMK1J4skK1ETXioR/edit'
      };

      if (cleanSegments.length === 1 && FALLBACK_REDIRECTS[cleanSegments[0]]) {
        window.location.replace(FALLBACK_REDIRECTS[cleanSegments[0]]);
        return;
      }

      // 4. Si no se encuentra el enlace
      const requestedSlug = cleanSegments.join('/');
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('status-title').textContent = 'Enlace No Encontrado';
      document.getElementById('status-desc').innerHTML = 'El alias <span class="badge-slug">/' + requestedSlug + '</span> no existe o ha sido desactivado en la plataforma.';
      const btnPortal = document.getElementById('btn-portal');
      if (btnPortal) {
        if (cleanSegments.length >= 2) {
          btnPortal.href = basePath + cleanSegments[0] + '/';
          btnPortal.innerHTML = '<i class="fa-solid fa-house"></i> Ir al Portal de ' + cleanSegments[0].toUpperCase();
        } else {
          btnPortal.href = basePath;
          btnPortal.innerHTML = '<i class="fa-solid fa-house"></i> Ir al Portal Principal';
        }
        btnPortal.style.display = 'inline-flex';
      }
    })();
  </script>
</body>
</html>
