<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscando Enlace... | NOX Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #080114;
      --card: rgba(18, 7, 43, 0.92);
      --primary: #FF007F;
      --cyan: #00F0FF;
      --green: #00FF88;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 45%);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .box {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--card);
      border: 1px solid rgba(255, 0, 127, 0.3);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      max-width: 520px;
      width: 100%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.6rem;
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #C70062 100%);
      color: #FFF;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
    }
    .badge-slug {
      font-family: monospace;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="box" id="content-box">
    <div class="spinner" id="loading-spinner"></div>
    <h1 id="status-title">Resolviendo Enlace...</h1>
    <p id="status-desc">Buscando la direccion solicitada en el catalogo oficial de NOX.</p>
    <a href="./" class="btn btn-primary" id="btn-portal" style="display: none;">
      <i class="fa-solid fa-house"></i> Ir al Portal de Enlaces
    </a>
  </div>

  <script>
    (async function resolveRedirect() {
      // 1. Mapeo instantaneo de emergencia en caso de retraso en fetch
      const FALLBACK_REDIRECTS = {
        'menu': 'https://script.google.com/macros/s/AKfycbzBLqsY6YqLex1KzvvlBT5viV8KNmw2VlKL8kZ-Wn5_/dev',
        'db': 'https://docs.google.com/spreadsheets/d/1vqtsoonbIRhnQ8bas060h27p7C-TKAIDX7cdHE8Ok5E/edit',
        'editor': 'https://script.google.com/home/projects/19Jj1QYs18vnHqS9FqM41cnGebJPlyRewE035hxI8VMK1J4skK1ETXioR/edit',
        'ig': 'https://www.instagram.com/noxslushnbeats/'
      };

      // 2. Extraer slug de la ruta
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      // Si el repositorio es 'links', el slug suele ser el ultimo segmento
      const slug = (pathSegments.length > 0 ? pathSegments[pathSegments.length - 1] : '').toLowerCase();

      if (!slug || slug === 'links' || slug === '404.html') {
        window.location.replace('./');
        return;
      }

      // Si coincide en fallback instantaneo, redirigir sin esperar
      if (FALLBACK_REDIRECTS[slug]) {
        window.location.replace(FALLBACK_REDIRECTS[slug]);
        return;
      }

      // 3. Consultar archivo redirects.json dinamico
      try {
        const res = await fetch('./redirects.json?v=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          const match = (data.redirects || []).find(r => r.slug.toLowerCase() === slug && r.is_active !== false);
          if (match && match.url) {
            window.location.replace(match.url);
            return;
          }
        }
      } catch (e) {
        console.error('Error al resolver redirects.json:', e);
      }

      // 4. Si no se encuentra el enlace
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('status-title').textContent = 'Enlace No Encontrado';
      document.getElementById('status-desc').innerHTML = 'El alias <span class="badge-slug">/' + slug + '</span> no existe o ha sido desactivado en la plataforma.';
      document.getElementById('btn-portal').style.display = 'inline-flex';
    })();
  </script>
</body>
</html>
